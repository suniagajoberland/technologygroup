<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Technology group - Soluciones en Iluminacion y Electricidad</title>

    <!-- FUENTE E ICONOS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" href="img/ico.jpeg" type="image/jpeg" />

    <!-- ESTILOS DE LA PAGINA -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ================================================
         MENU (NAVBAR) HORIZONTAL STICKY CON BUSCADOR
         ================================================ -->
    <nav class="navbar" id="navbar">
      <div class="nav-container">
        <div class="nav-row">
          <div class="nav-brand">
            <div class="logo">
              <img src="img/tg.jpeg" alt="Technology Group" />
            </div>
          </div>
          <div class="nav-search">
            <div class="search-container">
              <i class="fas fa-search search-icon"></i>
              <input
                type="text"
                id="productSearch"
                class="search-input"
                placeholder="Buscar productos por nombre..."
                autocomplete="off"
              />
              <button class="search-clear" id="searchClear" aria-label="Limpiar búsqueda">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- ================================================
         SECCION UNICA DE PRODUCTOS
         ================================================ -->
    <section class="products-section" id="productos">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Nuestros Productos</span>
          <h2 class="section-title">Catálogo</h2>
          <div class="search-results-info" id="searchResultsInfo" style="display: none;">
            <span id="searchResultsText"></span>
          </div>
        </div>
        <div class="brand-filter" id="brandFilter">
          <button class="brand-filter-btn active" data-brand="all">Todos</button>
        </div>
        <div class="products-grid" id="productsGrid"></div>
        <div class="no-results" id="noResults" style="display: none;">
          <i class="fas fa-search"></i>
          <h3>No se encontraron productos</h3>
          <p>Intenta con otro término de búsqueda o marca</p>
        </div>
      </div>
    </section>

    <!-- ================================================
         FOOTER (PIE DE PAGINA)
         ================================================ -->
    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 Technology Group. Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>

    <!-- ================================================
         BOTON FLOTANTE DE WHATSAPP
         ================================================ -->
    <a
      class="whatsapp-float"
      href="https://wa.me/584226382165?text=Hola%2C%20me%20gustar%C3%ADa%20obtener%20informaci%C3%B3n%20sobre%20sus%20productos."
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contactar por WhatsApp"
    >
      <i class="fab fa-whatsapp"></i>
    </a>

    <!-- ================================================
         MODAL PARA VER LAS FOTOS DE UN PRODUCTO
         ================================================ -->
    <div class="image-modal" id="imageModal">
      <button class="modal-close" id="modalClose">
        <i class="fas fa-times"></i>
      </button>
      <button class="modal-nav modal-prev" id="modalPrev">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="modal-nav modal-next" id="modalNext">
        <i class="fas fa-chevron-right"></i>
      </button>
      <div class="modal-content">
        <img id="modalImage" src="" alt="Producto" />
        <div class="modal-dots" id="modalDots"></div>
      </div>
    </div>

    <!-- DATOS DE PRODUCTOS (editar aqui) -->
    <script src="data.js"></script>

    <!-- LOGICA DE LA PAGINA -->
    <script src="app.js"></script>
  </body>
</html>
